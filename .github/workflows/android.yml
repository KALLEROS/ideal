# Compila la app de Android y su widget, corre las pruebas y deja listo el instalable (Ideal.apk).
name: Android
on:
  push:
    branches: [main]
    paths: ['android/**', 'web/**', 'pruebas/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # La llave con la que se firma la app vive en los secretos del repositorio. Siempre debe ser la misma:
      # si cambia, el teléfono no deja actualizar la app sin desinstalarla antes.
      - name: Preparar la llave de firma
        env:
          LLAVES_B64: ${{ secrets.IDEAL_LLAVES_B64 }}
        run: |
          if [ -n "$LLAVES_B64" ]; then
            echo "$LLAVES_B64" | base64 -d > "$RUNNER_TEMP/ideal.p12"
            echo "IDEAL_LLAVES=$RUNNER_TEMP/ideal.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No hay llave de firma en los secretos; se usa la de pruebas."
          fi

      - name: Probar el motor y compilar
        env:
          IDEAL_LLAVES_CLAVE: ${{ secrets.IDEAL_LLAVES_CLAVE }}
          IDEAL_NUMERO: ${{ github.run_number }}
        run: |
          cd android
          gradle --no-daemon --console=plain testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Ideal.apk
          ls -lh ../Ideal.apk

      - name: Guardar el instalable
        uses: actions/upload-artifact@v4
        with:
          name: Ideal-Android
          path: Ideal.apk

      - name: Publicar en Instaladores
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view instaladores >/dev/null 2>&1 || gh release create instaladores --title "Instaladores" \
            --notes "Los archivos para instalar Ideal: Ideal.ipa (iPhone) e Ideal.apk (Android). Se actualizan solos con cada cambio. Las instrucciones están en el README." || true
          gh release upload instaladores Ideal.apk --clobber
