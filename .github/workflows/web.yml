# Prueba el motor y publica la app web (la carpeta web) en GitHub Pages.
name: Web
on:
  push:
    branches: [main]
    paths: ['web/**', 'pruebas/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pagina.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Probar el motor
        run: node --test pruebas/motor.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: pagina
        uses: actions/deploy-pages@v4
