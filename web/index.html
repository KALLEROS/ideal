<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ideal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Tu rutina del día en círculos que se llenan: agua, dientes, perro, cama y lo que tú elijas. Funciona sin internet.">
<title>Ideal</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="techo"></div>
<main id="vista"></main>

<nav class="pestanas" id="pestanas" aria-label="Secciones" hidden>
  <button type="button" data-pestana="hoy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M4.1 14.6h15.8A8.6 8.6 0 0 1 12 20.6a8.6 8.6 0 0 1-7.9-6Z" fill="currentColor" stroke="none"/></svg>
    Hoy
  </button>
  <button type="button" data-pestana="registro">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="3.6" y="5" width="16.8" height="15" rx="4"/><path d="M3.6 10h16.8M8 3.2v3.2M16 3.2v3.2"/></svg>
    Registro
  </button>
  <button type="button" data-pestana="circulos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="7.4" cy="7.4" r="3.6"/><circle cx="16.6" cy="7.4" r="3.6"/><circle cx="7.4" cy="16.6" r="3.6"/><path d="M16.6 13.4v6.4M13.4 16.6h6.4"/></svg>
    Círculos
  </button>
  <button type="button" data-pestana="ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7.5h9M17.5 7.5H20M4 16.5h2.5M11 16.5h9"/><circle cx="15.2" cy="7.5" r="2.3"/><circle cx="8.8" cy="16.5" r="2.3"/></svg>
    Ajustes
  </button>
</nav>

<div id="capas"></div>

<script src="motor.js"></script>
<script src="catalogo.js"></script>
<script src="datos.js"></script>
<script src="app.js"></script>
</body>
</html>
