# Receta del proyecto de Xcode. El proyecto no se guarda en el repositorio: se genera con
#   brew install xcodegen && cd ios && xcodegen generate
# Son tres partes: la app (muestra la carpeta web y guarda los datos), el widget y las pruebas.
name: Ideal
options:
  bundleIdPrefix: com.kalleros
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Ideal:
    type: application
    platform: iOS
    sources:
      - path: Ideal
      - path: Compartido
      - path: ../web
        type: folder
        buildPhase: resources
    info:
      path: Ideal/Info.plist
      properties:
        CFBundleDisplayName: Ideal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: FondoInicio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Ideal/Ideal.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kalleros.ideal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kalleros.ideal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: IdealWidget
  IdealWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: IdealWidget
      - path: Compartido
    info:
      path: IdealWidget/Info.plist
      properties:
        CFBundleDisplayName: Ideal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: IdealWidget/IdealWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kalleros.ideal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kalleros.ideal.widget
  IdealTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IdealTests
      - path: ../pruebas/casos.json
        buildPhase: resources
    dependencies:
      - target: Ideal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kalleros.ideal.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Ideal:
    build:
      targets:
        Ideal: all
        IdealTests: [test]
    test:
      targets:
        - IdealTests
